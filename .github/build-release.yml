          name: Build WORKER PRO Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > worker-pro-release.jks

      - name: Build signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/worker-pro-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Check AAB
        run: |
          echo "AAB files:"
          find app/build/outputs/bundle -type f -name "*.aab" -ls

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: WORKER-PRO-SIGNED-AAB
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 7
