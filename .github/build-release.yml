name: Build WORKER PRO AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release AAB
        run: gradle :app:bundleRelease

      - name: Check AAB
        run: |
          echo "AAB files:"
          find app/build/outputs/bundle -type f -name "*.aab" -ls

      - name: Upload WORKER PRO AAB
        uses: actions/upload-artifact@v4
        with:
          name: WORKER-PRO-release-AAB
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 7
